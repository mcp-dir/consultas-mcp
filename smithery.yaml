# Smithery configuration for Consultas
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_consultas

name: consultas-mcp
displayName: "Consultas"
description: >
  Consultas em fontes oficiais sobre pessoas e empresas: situação cadastral (CPF/CNPJ), Simples/MEI, SINTEGRA, certidões (CND Federal, CNDT, FGTS), TCU, sanções (OFAC/ONU/ICIJ) e NF-e. Hospedado pela plataforma, sem credenciais, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/consultas-mcp
repository: https://github.com/mcp-dir/consultas-mcp

tags:
  - consultas
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_consultas

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_consultas/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
